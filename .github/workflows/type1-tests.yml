name: Tracker tests (pytest)

# R10: the repository's tests are pytest-style as well as unittest-style. The earlier unittest-only job installed no pytest and failed
# with ModuleNotFoundError on pytest-importing modules. pytest collects every unittest TestCase too (verified: the 453 unittest ids are a strict
# subset of the 606 pytest ids at the R10 tree), so unittest is not run separately.
# CI evidence covers the pytest collection only; it is not a mutation-sweep result and not provider/integration proof.

on:
  pull_request:
    paths:
      - "tracker_identity/**"
      - "stage_a/**"
      - "tracker_component/**"
      - "tests/**"
      - "requirements-ci.txt"
      - "TYPE1_SCOPE.md"
      - ".github/workflows/type1-tests.yml"
  push:
    branches:
      - "main"
      - "type1/tracker-identity-surface"
      - "stage-a/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Run pytest collection
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m pytest tests -q
